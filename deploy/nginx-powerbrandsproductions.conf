# /etc/nginx/sites-available/powerbrandsproductions  (HTTP first; certbot adds HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name powerbrandsproductions.com www.powerbrandsproductions.com;

    root /var/www/powerbrandsproductions/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    access_log /var/log/nginx/powerbrandsproductions.access.log;
    error_log  /var/log/nginx/powerbrandsproductions.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-pbp.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Only index.php is executable.
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* { deny all; }
}
