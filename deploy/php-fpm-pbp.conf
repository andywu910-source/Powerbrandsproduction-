; /etc/php/8.4/fpm/pool.d/pbp.conf  (PowerBrands Productions, runs as user pbp)
[pbp]
user = pbp
group = pbp
listen = /run/php/php8.4-fpm-pbp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Keep this app inside its own folder (isolation from staticpowered).
php_admin_value[open_basedir] = /var/www/powerbrandsproductions:/tmp:/usr/share/php
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 21M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/powerbrandsproductions/storage/logs/php-fpm-errors.log
